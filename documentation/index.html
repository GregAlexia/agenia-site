<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AgenIA — Documentation</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://quygyeesmtxgykerjtjr.supabase.co; form-action 'self'; base-uri 'self'; object-src 'none'">

  <style>
:root{--tx:#1c1a17;--mu:#6b635a;--ln:#e2ddd5;--bg:#fdfcfa;--ac:#b4552d;--sb:#f6f3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}

/* ---- Portail de connexion ---- */
#portail{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
/* [hidden] seul perd contre le display:flex ci-dessus (spécificité). */
#portail[hidden]{display:none}
#carte{width:100%;max-width:400px;background:#fff;border:1px solid var(--ln);
border-radius:14px;padding:38px 34px;box-shadow:0 8px 30px rgba(60,50,40,.09)}
#carte h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
#carte>p{color:var(--mu);font-size:14px;margin:0 0 24px}
label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
color:var(--mu);margin:14px 0 7px;font-weight:600}
#carte label:first-of-type{margin-top:0}
input{width:100%;padding:11px 13px;font-size:15px;border:1px solid var(--ln);
border-radius:8px;background:var(--sb);font-family:inherit}
input:focus{outline:none;border-color:var(--ac);background:#fff}
button{padding:11px 18px;font-size:15px;font-family:inherit;font-weight:600;
color:#fff;background:var(--ac);border:0;border-radius:8px;cursor:pointer}
button:hover{background:#9d4726}
button:disabled{opacity:.55;cursor:default}
#valider,#validerCode{width:100%;margin-top:18px}
#lignelien{margin:12px 0 0;text-align:center;font-size:13px}
#lienOubli{background:none;border:0;padding:0;color:var(--mu);font-size:13px;
font-weight:400;cursor:pointer}
#lienOubli:hover{color:var(--ac);text-decoration:underline;background:none}
#lienOubli:disabled{opacity:.55;cursor:default;text-decoration:none}
#formCode{margin-top:16px;padding-top:16px;border-top:1px solid var(--ln)}
#formCode>p{color:var(--mu);font-size:13px;margin:0 0 4px}
#msg{margin-top:14px;font-size:13.5px;color:var(--mu);min-height:19px}
#retour{display:block;margin-top:22px;font-size:13px;color:var(--mu);text-decoration:none}
#retour:hover{color:var(--ac)}

/* ---- Documentation (après connexion) ---- */
#contenu{padding:36px 20px 80px}
.conteneur{max-width:820px;margin:0 auto}
.barre{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
gap:12px;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--ln)}
.barre span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;
color:var(--mu);font-weight:600}
#deconnexion{background:transparent;color:var(--mu);border:1px solid var(--ln);
padding:7px 14px;font-size:13px}
#deconnexion:hover{background:var(--sb);color:var(--tx)}
#doc h1{font-size:26px;margin:0 0 8px;letter-spacing:-.01em}
#doc h2{font-size:18px;margin:34px 0 10px}
#doc h3{font-size:15px;margin:24px 0 8px}
#doc p{margin:0 0 14px}
#doc .chapeau{color:var(--mu);font-size:17px;margin-bottom:28px}
#doc ul,#doc ol{margin:0 0 16px;padding-left:22px}
#doc li{margin-bottom:7px}
#doc code{background:var(--sb);border:1px solid var(--ln);border-radius:4px;
padding:1px 5px;font-size:13.5px}
#doc a{color:var(--ac)}
#doc table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14px}
#doc th,#doc td{border:1px solid var(--ln);padding:8px 10px;text-align:left;vertical-align:top}
#doc th{background:var(--sb)}
#chargement{color:var(--mu);text-align:center;padding:60px 0}
  </style>
</head>
<body>

<div id="portail">
  <div id="carte">
    <h1>Documentation interne</h1>
    <p>Cette page est réservée au compte administrateur du site.</p>

    <label for="mdp">Mot de passe du compte</label>
    <input id="mdp" type="password" autocomplete="current-password" autofocus>

    <button id="valider" type="button">Accéder à la documentation</button>
    <p id="lignelien"><button id="lienOubli" type="button">Mot de passe oublié ?</button></p>

    <div id="formCode" hidden>
      <p>Saisissez le code reçu, puis choisissez un nouveau mot de passe.</p>

      <label for="code">Code à 6 chiffres</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">

      <label for="nouveauMdp">Nouveau mot de passe</label>
      <input id="nouveauMdp" type="password" autocomplete="new-password" minlength="8">

      <label for="nouveauMdp2">Confirmer</label>
      <input id="nouveauMdp2" type="password" autocomplete="new-password" minlength="8">

      <button id="validerCode" type="button">Enregistrer le nouveau mot de passe</button>
    </div>

    <div id="msg" role="status" aria-live="polite"></div>
    <a id="retour" href="../index.html">&larr; Retour sur agenia.pro</a>
  </div>
</div>

<div id="contenu" hidden>
  <div class="conteneur">
    <div class="barre">
      <span>AgenIA — Documentation interne</span>
      <button id="deconnexion" type="button">Se déconnecter</button>
    </div>
    <div id="doc"><div id="chargement">Chargement…</div></div>
  </div>
</div>

<script src="documentation.js"></script>
</body>
</html>
