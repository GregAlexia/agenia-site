<html lang="fr"><head><meta charset="utf-8">

<title>AgenIA — Documentation</title>
<style>
:root{--tx:#1c1a17;--mu:#6b635a;--ln:#e2ddd5;--bg:#fdfcfa;--ac:#b4552d;--sb:#f6f3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}
#portail{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#carte{width:100%;max-width:400px;background:#fff;border:1px solid var(--ln);
border-radius:14px;padding:38px 34px;box-shadow:0 8px 30px rgba(60,50,40,.09)}
#carte h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
#carte p{color:var(--mu);font-size:14px;margin:0 0 24px}
label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
color:var(--mu);margin-bottom:7px;font-weight:600}
input{width:100%;padding:11px 13px;font-size:15px;border:1px solid var(--ln);
border-radius:8px;background:var(--sb);font-family:inherit}
input:focus{outline:none;border-color:var(--ac);background:#fff}
button{width:100%;margin-top:14px;padding:11px;font-size:15px;font-family:inherit;
font-weight:600;color:#fff;background:var(--ac);border:0;border-radius:8px;cursor:pointer}
button:hover{background:#9d4726}
button:disabled{opacity:.55;cursor:default}
#msg{margin-top:14px;font-size:13.5px;color:#a8342a;min-height:19px}
#retour{display:block;margin-top:22px;font-size:13px;color:var(--mu);text-decoration:none}
#retour:hover{color:var(--ac)}
#contenu{display:none}
</style></head><body>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function ouvrir(motdepasse){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(motdepasse),
    "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b(COFFRE.sel), iterations:COFFRE.iterations, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(COFFRE.iv)}, cle, b(COFFRE.donnees));
  return new TextDecoder().decode(clair);
}

const champ = document.getElementById("mdp");
const bouton = document.getElementById("valider");
const msg = document.getElementById("msg");

async function tenter(){
  if(!champ.value) return;
  bouton.disabled = true; msg.textContent = "Déchiffrement en cours…"; msg.style.color = "#6b635a";
  try{
    const html = await ouvrir(champ.value);
    sessionStorage.setItem("agenia_doc_mdp", champ.value);
    afficher(html);
  }catch(e){
    msg.textContent = "Mot de passe incorrect."; msg.style.color = "#a8342a";
    bouton.disabled = false; champ.select();
  }
}

function afficher(html){
  document.getElementById("portail").remove();
  const zone = document.getElementById("contenu");
  zone.innerHTML = html;
  zone.style.display = "block";
  const h1 = zone.querySelector("h1");
  if(h1) document.title = h1.textContent + " | AgenIA";
  zone.querySelectorAll("script").forEach(s => {
    const n = document.createElement("script"); n.textContent = s.textContent;
    document.body.appendChild(n); s.remove();
  });
}

bouton.addEventListener("click", tenter);
champ.addEventListener("keydown", e => { if(e.key === "Enter") tenter(); });

// session déjà ouverte : on rouvre sans redemander
(async () => {
  const memo = sessionStorage.getItem("agenia_doc_mdp");
  if(!memo) return;
  try{ afficher(await ouvrir(memo)); }
  catch(e){ sessionStorage.removeItem("agenia_doc_mdp"); }
})();
</script>
