<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statistiques — AgenIA</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f0efe8" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://quygyeesmtxgykerjtjr.supabase.co https://margeo.vercel.app; form-action 'self'; base-uri 'self'; object-src 'none'" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d8bff'/%3E%3Cstop offset='1' stop-color='%23b06bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23070b18'/%3E%3Cpath d='M16 6l8 20h-4l-1.4-3.8h-5.2L12 26H8L16 6zm0 7.2l-1.6 4.4h3.2L16 13.2z' fill='url(%23g)'/%3E%3C/svg%3E" />

  <style>
    :root { --tx:#1c1a17; --mu:#6b635a; --ln:#e2ddd5; --bg:#fdfcfa; --ac:#b4552d; --sb:#f6f3ee; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--tx);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    }

    /* ---- Portail de connexion ---- */
    #portail { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #carte {
      width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--ln);
      border-radius: 14px; padding: 38px 34px; box-shadow: 0 8px 30px rgba(60, 50, 40, .09);
    }
    /* [hidden] seul perd contre le display:flex ci-dessus (spécificité) —
       cette règle plus spécifique (#portail[hidden]) reprend la main. */
    #portail[hidden] { display: none; }
    #carte h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
    #carte p { color: var(--mu); font-size: 14px; margin: 0 0 24px; }
    label { display: block; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--mu); margin: 14px 0 7px; font-weight: 600; }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%; padding: 11px 13px; font-size: 15px; border: 1px solid var(--ln);
      border-radius: 8px; background: var(--sb); font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--ac); background: #fff; }
    button {
      padding: 11px 18px; font-size: 15px; font-family: inherit; font-weight: 600;
      color: #fff; background: var(--ac); border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #9d4726; }
    button:disabled { opacity: .55; cursor: default; }
    #valider { width: 100%; margin-top: 18px; }
    #oubli { margin: 12px 0 0; text-align: center; font-size: 13px; }
    #oubli a { color: var(--mu); text-decoration: none; }
    #oubli a:hover { color: var(--ac); text-decoration: underline; }
    #msg { margin-top: 14px; font-size: 13.5px; color: var(--mu); min-height: 19px; }

    /* ---- Contenu (après connexion) ---- */
    #contenu { padding: 32px 20px 60px; }
    .conteneur { max-width: 1100px; margin: 0 auto; }
    .entete { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .entete h1 { font-size: 22px; margin: 0; }
    #deconnexion { background: transparent; color: var(--mu); border: 1px solid var(--ln); padding: 7px 14px; font-size: 13px; }
    #deconnexion:hover { background: var(--sb); }
    .sousTitre { color: var(--mu); font-size: 14px; margin: 0 0 28px; }

    .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .tuile { border: 1px solid var(--ln); border-radius: 12px; background: #fff; padding: 16px; }
    .tuile b { display: block; font-size: 24px; }
    .tuile span { display: block; font-size: 13px; color: var(--mu); margin-top: 2px; }

    h2 { font-size: 16px; margin: 32px 0 4px; }
    .note { color: var(--mu); font-size: 13px; margin: 0 0 12px; }

    .tables { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 800px) { .tables { grid-template-columns: 1fr 1fr; } }

    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--ln); border-radius: 10px; overflow: hidden; font-size: 13.5px; }
    th { text-align: left; background: var(--sb); color: var(--mu); font-weight: 600; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    td { padding: 9px 12px; border-top: 1px solid var(--ln); vertical-align: top; }
    td.chiffre { text-align: right; font-weight: 600; }
    .barre { height: 6px; border-radius: 3px; background: var(--ac); opacity: .55; }
    .vide { text-align: center; color: var(--mu); padding: 24px; }

    .puce { display: inline-block; background: var(--sb); color: var(--tx); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .detail span { display: block; }
    .scroll { overflow-x: auto; }

    #corps.chargement { color: var(--mu); padding: 40px 0; text-align: center; }
  </style>
</head>
<body>

  <div id="portail">
    <div id="carte">
      <h1>Statistiques agenia.pro</h1>
      <p>Réservé au compte administrateur.</p>

      <label for="mdp">Mot de passe du compte</label>
      <input id="mdp" type="password" autocomplete="current-password" />

      <button id="valider">Se connecter</button>
      <p id="oubli">
        <a href="https://margeo.vercel.app/forgot-password" target="_blank" rel="noopener">Mot de passe oublié ?</a>
      </p>
      <div id="msg"></div>
    </div>
  </div>

  <div id="contenu" hidden>
    <div class="conteneur">
      <div class="entete">
        <h1>Statistiques agenia.pro</h1>
        <button id="deconnexion">Se déconnecter</button>
      </div>
      <p class="sousTitre">
        Pages vues et prospects capturés sur le site — contact, démo Keo,
        démo des outils Duopilot, ressources.
      </p>
      <div id="corps" class="chargement">Chargement…</div>
    </div>
  </div>

  <script src="statistiques.js"></script>
</body>
</html>
