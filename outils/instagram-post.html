<!DOCTYPE html>
<!-- Gabarit des visuels Instagram, 1080 × 1080 — un seul fichier pour les
     quatre types de carte d'un carrousel (hook, point, regard AgenIA, CTA),
     pas un fichier par type : le dessin ne doit exister qu'une fois, comme
     pour og-image.html, sinon les types divergent au premier changement de
     charte et personne ne le voit — aucun contrôle ne lit une image.

     Contenu piloté par la chaîne de requête, une carte à la fois :
       ?type=hook&tag=…&titre=…&corps=…
       ?type=point&tag=01+·+Le+symptôme&num=1+/+5&titre=…&corps=…
       ?type=quote&tag=Le+regard+d'AgenIA&titre=…&corps=…
       ?type=cta&titre=…&corps=…

     www.agenia.pro est fixe en pied de page, sur les quatre types — pas un
     paramètre : une carte qui circule seule (repartagée, sauvegardée) doit
     toujours porter l'adresse du site.

     `illustration` (chemin relatif vers une image PNG détourée, ex.
     mascotte/reflexion.png) remplace le texte de corps par la mascotte
     AgenIA, mise en situation sur le sujet du hook — personnage illustré
     depuis le 28/09/2026, plus le robot des premières cartes. `props`
     ajoute une rangée de badges sous la mascotte, jamais dessus — la
     mascotte reste toujours entière, tête comprise, c'est la règle qui ne
     se discute pas. Format : liste séparée par des virgules de
     `icone:texte du badge`, ex. :

       ?illustration=mascotte/reflexion.png
       &props=email:Plus+d'emails,bulle:Lead+noté,
              telephone:Plus+de+relances,resultat:0+RDV+obtenu

     Icônes disponibles : email, telephone, bulle, resultat (le badge qui
     tranche, bordure pleine plutôt que grise). Le processus complet —
     écrire le script de mise en situation, le faire valider par le
     propriétaire avant toute publication, choisir ou recadrer la pose —
     vit dans reseauteo, .claude/skills/agenia-contenu/reference/mascotte.md
     (pas ici : ce gabarit ne fait qu'exécuter la mise en page une fois le
     script validé).

     Sans JavaScript, le gabarit montre encore quelque chose de juste (le
     premier hook validé du carrousel « Prospection mal cadrée ») — même
     principe que og-image.html.

     Pour générer les images d'un carrousel : voir outils/faire-instagram.cjs.
     ============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  /* Mêmes fontes et mêmes teintes que le reste du site (og-image.html) : un
     visuel Instagram doit être reconnaissable comme un visuel AgenIA au
     premier coup d'œil, pas comme un gabarit générique rempli au dernier
     moment. */
  @font-face { font-family:"Archivo"; font-style:normal; font-weight:600;
    src:url("../assets/fonts/archivo-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"Archivo"; font-style:normal; font-weight:700;
    src:url("../assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Serif 4"; font-style:normal; font-weight:400;
    src:url("../assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1080px;background:#f0efe8;color:#171613;
       font-family:"Source Serif 4",Georgia,serif;overflow:hidden}
  .cadre{height:100%;padding:64px;display:flex;flex-direction:column}

  .entete{display:flex;align-items:center;justify-content:space-between}
  .tag{font-family:"Archivo",sans-serif;font-weight:600;font-size:20px;
       letter-spacing:.12em;text-transform:uppercase;color:#57534a;
       display:flex;align-items:center;gap:12px}
  .tag::before{content:"";width:11px;height:11px;border-radius:50%;
       background:linear-gradient(135deg,#6d8bff,#b06bff)}
  .num{font-family:"Archivo",sans-serif;font-weight:600;font-size:18px;
       letter-spacing:.06em;color:#57534a}

  /* Un seul style de titre, que ce soit le hook, un point ou la citation du
     regard AgenIA — h1 et .quote partagent exactement les mêmes règles,
     jamais une police différente pour l'un des quatre types. */
  h1, .quote{font-family:"Archivo",sans-serif;font-weight:700;font-size:64px;
     line-height:1.14;letter-spacing:-.02em;margin-top:32px}

  /* Le milieu remplit tout ce qui reste entre le titre et le pied — jamais
     un bloc de texte collé sous le titre avec un grand vide avant le pied.
     Un seul enfant visible à la fois (texte ou illustration), centré dans
     l'espace disponible plutôt qu'aligné en haut. */
  .milieu{flex:1;display:flex;align-items:center;margin-top:28px;min-height:0}
  .corps{font-size:40px;line-height:1.5;color:#57534a;max-width:900px}

  /* La mascotte au-dessus, les badges dessous — jamais l'inverse, jamais un
     badge posé sur elle : la règle du propriétaire est qu'elle apparaisse
     toujours entière, tête comprise.

     RÈGLE DE REMPLISSAGE (28/09/2026) : l'illustration n'a plus de hauteur
     fixe en pixels — `flex:1` la fait grandir jusqu'à occuper tout ce que
     la scène laisse une fois les badges posés, et la scène occupe elle-même
     toute la hauteur du milieu (100%, pas un hug-content centré avec du
     vide autour). Un titre plus court ou plus long, une future pose plus
     large : la mascotte se redimensionne automatiquement, sans numéro magique
     à retoucher par article. `object-fit:contain` respecte les proportions
     du fichier sans jamais rogner dedans — c'est ce qui garantit "entière,
     tête comprise" au niveau du CSS, pas seulement au niveau du recadrage.
     Corollaire côté recadrage d'une pose (voir aussi reference/mascotte.md) :
     détourer au plus près du personnage, sans marge transparente inutile —
     toute marge vide dans le fichier réduit d'autant la taille perçue une
     fois affiché, `object-fit:contain` ne fait qu'agrandir le fichier tel
     quel, marge comprise. */
  .scene{height:100%;display:flex;flex-direction:column;align-items:center;gap:24px;width:100%}
  .illustration{flex:1;min-height:0;max-width:100%;display:block;object-fit:contain}
  .props{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:920px}
  .prop{display:flex;align-items:center;gap:8px;font-family:"Archivo",sans-serif;
       font-weight:600;font-size:17px;color:#57534a;background:#fff;
       padding:9px 16px;border:1px solid #d3ccbc;border-radius:100px}
  .prop svg{width:18px;height:18px;flex:none}
  .prop.resultat{color:#171613;border-color:#171613;font-weight:700}

  .pied{padding-top:28px;border-top:1px solid #d3ccbc;
       display:flex;justify-content:space-between;align-items:center}
  .marque{display:flex;align-items:center;gap:14px}
  .marque img{width:52px;height:52px;border-radius:11px}
  .marque span{font-family:"Archivo",sans-serif;font-weight:700;font-size:22px;
       letter-spacing:.06em}
  .foot-droite{font-family:"Archivo",sans-serif;font-size:22px;color:#57534a;
       letter-spacing:.02em}
</style>
</head>
<body>
  <div class="cadre">
    <div class="entete">
      <p class="tag" id="tag">3 mythes qui coûtent cher</p>
      <span class="num" id="num" hidden></span>
    </div>

    <h1 id="titre">3 mythes sur la prospection automatisée.</h1>
    <p class="quote" id="quote" hidden></p>

    <div class="milieu">
      <p class="corps" id="corps">Le dernier grille un domaine d'envoi entier.</p>
      <div class="scene" id="scene" hidden>
        <img class="illustration" id="illustration" alt="">
        <div class="props" id="props"></div>
      </div>
    </div>

    <svg aria-hidden="true" style="position:absolute;width:0;height:0">
      <symbol id="icone-email" viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icone-telephone" viewBox="0 0 24 24">
        <path d="M6.6 3.5c.6-.2 1.3 0 1.6.6l1.4 2.7c.3.5.2 1.1-.2 1.5L8.1 9.6c.8 2 2.4 3.6 4.4 4.4l1.3-1.3c.4-.4 1-.5 1.5-.2l2.7 1.4c.6.3.8 1 .6 1.6l-.7 2c-.2.6-.8 1-1.4 1-7 0-13-6-13-13 0-.6.4-1.2 1-1.4l2-.6z"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icone-bulle" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M8 17v3.5L12.5 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icone-resultat" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <line x1="6.5" y1="17.5" x2="17.5" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    </svg>

    <div class="pied">
      <div class="marque">
        <img src="../assets/logo_agenia-hd.png" alt="">
        <span>AGENIA</span>
      </div>
      <span class="foot-droite">www.agenia.pro</span>
    </div>
  </div>

<script>
  /* Aucun paramètre du tout : le gabarit garde son contenu par défaut, écrit
     en dur ci-dessus — même principe que og-image.html. Dès qu'un `type` est
     fourni (c'est le cas à chaque appel de faire-instagram.cjs), chaque champ
     se recalcule entièrement à partir de la requête : un champ absent se vide
     et se masque. Le pied (www.agenia.pro) n'est pas de ceux-là : il est fixe
     dans le HTML, sur les quatre types. */
  (function () {
    var q = new URLSearchParams(location.search);
    var type = q.get("type"); // hook | point | quote | cta
    if (type === null) return;

    function champ(nom, id) {
      var valeur = q.get(nom) || "";
      var el = document.getElementById(id);
      el.textContent = valeur;
      el.hidden = !valeur;
    }

    champ("tag", "tag");
    champ("num", "num");

    if (type === "quote") {
      document.getElementById("titre").hidden = true;
      champ("titre", "quote");
    } else {
      champ("titre", "titre");
    }

    // Une illustration remplace le corps de texte, elle ne coexiste pas
    // avec lui : le milieu montre l'un ou l'autre, jamais les deux.
    var illustration = q.get("illustration");
    if (illustration) {
      var img = document.getElementById("illustration");
      img.src = illustration;
      img.alt = q.get("corps") || q.get("titre") || "";
      document.getElementById("scene").hidden = false;
      document.getElementById("corps").hidden = true;

      // Badges sous la mascotte : "icone:texte,icone:texte,…". Une icône
      // inconnue n'interrompt rien, elle sort simplement sans pictogramme.
      var propsParam = q.get("props");
      if (propsParam) {
        var conteneur = document.getElementById("props");
        propsParam.split(",").forEach(function (entree) {
          var i = entree.indexOf(":");
          var cle = i === -1 ? entree : entree.slice(0, i);
          var texte = i === -1 ? "" : entree.slice(i + 1);
          var span = document.createElement("span");
          span.className = "prop" + (cle === "resultat" ? " resultat" : "");
          if (document.getElementById("icone-" + cle)) {
            span.innerHTML = '<svg><use href="#icone-' + cle + '"></use></svg>';
          }
          span.appendChild(document.createTextNode(texte));
          conteneur.appendChild(span);
        });
      }
    } else {
      champ("corps", "corps");
    }
  })();
</script>
</body>
</html>
