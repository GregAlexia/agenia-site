<!DOCTYPE html>
<!-- Gabarit des images de partage, 1200 × 630.
       assets/og-image.jpg      ← ce fichier sans paramètre
       assets/og-image-en.jpg   ← ce fichier avec ?lang=en

     Un seul gabarit pour les deux langues, et non deux fichiers : le dessin ne
     doit exister qu'une fois, sinon les deux versions divergent au premier
     changement de charte et personne ne le voit — aucun contrôle ne lit une
     image.

     Pour les régénérer après un changement d'accroche :
       python3 -m http.server 8420        (à la racine du site)
       node outils/faire-og.cjs

     Ce fichier n'est lié depuis nulle part, et `_redirects` empêche
     l'hébergeur de le servir : c'est un outil, pas une page. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  /* Mêmes fontes et mêmes teintes que le site : l'aperçu de partage est la
     première image qu'on voit d'AgenIA, elle doit être reconnaissable. */
  @font-face { font-family:"Archivo"; font-style:normal; font-weight:600;
    src:url("../assets/fonts/archivo-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"Archivo"; font-style:normal; font-weight:700;
    src:url("../assets/fonts/archivo-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Serif 4"; font-style:normal; font-weight:400;
    src:url("../assets/fonts/source-serif-4-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Serif 4"; font-style:italic; font-weight:600;
    src:url("../assets/fonts/source-serif-4-latin-400-italic.woff2") format("woff2"); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:#f0efe8;color:#171613;
       font-family:"Source Serif 4",Georgia,serif;overflow:hidden}
  .cadre{height:100%;padding:56px 72px;display:flex;flex-direction:column}

  .marque{display:flex;align-items:center;gap:16px;margin-bottom:52px}
  .marque img{width:62px;height:62px;border-radius:12px}
  .marque span{font-family:"Archivo",sans-serif;font-weight:700;font-size:23px;
       letter-spacing:.06em}

  .pastille{font-family:"Archivo",sans-serif;font-weight:600;font-size:15px;
       letter-spacing:.14em;text-transform:uppercase;color:#57534a;
       display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .pastille::before{content:"";width:9px;height:9px;border-radius:50%;background:#171613}

  h1{font-family:"Archivo",sans-serif;font-weight:600;font-size:72px;line-height:1.08;
     letter-spacing:-.02em}
  h1 em{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:600;
     letter-spacing:0}

  .accroche{font-size:26px;line-height:1.5;color:#57534a;margin-top:26px;max-width:900px}

  .pied{margin-top:auto;padding-top:24px;border-top:1px solid #d3ccbc;
     display:flex;justify-content:space-between;align-items:baseline;
     font-family:"Archivo",sans-serif;font-size:17px}
  .pied .url{font-weight:700}
  .pied .gamme{color:#57534a;letter-spacing:.03em}
</style>
</head>
<body>
  <div class="cadre">
    <div class="marque">
      <img src="../assets/logo_agenia-hd.png" alt="">
      <span>AGENIA</span>
    </div>

    <div class="pastille" id="pastille">Éditeur de logiciels IA · PME &amp; ETI</div>

    <h1 id="titre">Développez <em>vos idées</em>.<br>On automatise les processus.</h1>

    <p class="accroche" id="accroche">
      Margeo, Prospeo, Keo, Planeo — des logiciels métier édités et opérés
      par AgenIA, et le sur-mesure quand aucun ne convient.
    </p>

    <div class="pied">
      <span class="url">www.agenia.pro</span>
      <span class="gamme" id="gamme">Marges · Prospection · Immobilier · Construction</span>
    </div>
  </div>

<script>
  /* Le français est écrit en dur dans la page : sans JavaScript, le gabarit
     montre encore quelque chose de juste. L'anglais ne s'applique que sur
     demande explicite. Les textes reprennent mot pour mot ceux de /en/ —
     une image de partage qui promet autre chose que la page fait repartir. */
  if (location.search.indexOf("lang=en") !== -1) {
    document.documentElement.lang = "en";
    document.getElementById("pastille").textContent =
      "AI software publisher · small & mid-sized companies";
    document.getElementById("titre").innerHTML =
      "Build <em>your ideas</em>.<br>We automate your processes.";
    document.getElementById("accroche").textContent =
      "Margeo, Prospeo, Keo, Planeo — business software built and operated by " +
      "AgenIA, and bespoke work when none of them fits.";
    document.getElementById("gamme").textContent =
      "Margins · Prospecting · Property · Construction";
  }
</script>
</body>
</html>
