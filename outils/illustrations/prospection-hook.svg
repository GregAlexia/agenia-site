<svg viewBox="0 0 440 310" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Une volée de messages arrose toute une liste de contacts, aucun n'atteint le bon prospect, isolé à droite.">
  <!-- Le gag : on touche tout le monde, sauf la seule personne visée. Traits
       fins, mêmes teintes que le reste du site (og-image.html) — l'humour
       vient de la composition, pas d'un style cartoon qui jurerait avec le
       reste de la charte. -->

  <!-- Zone d'envoi : cercle en tirets, toute la liste de contacts -->
  <circle cx="150" cy="150" r="112" fill="none" stroke="#57534a" stroke-width="2"
          stroke-dasharray="6 7" opacity="0.55" />

  <!-- Messages envoyés, dispersés dans la zone -->
  <g fill="#171613">
    <rect x="91"  y="86"  width="16" height="16" rx="3" transform="rotate(-8 99 94)" />
    <rect x="136" y="64"  width="16" height="16" rx="3" transform="rotate(11 144 72)" />
    <rect x="181" y="89"  width="16" height="16" rx="3" transform="rotate(-14 189 97)" />
    <rect x="206" y="134" width="16" height="16" rx="3" transform="rotate(6 214 142)" />
    <rect x="191" y="181" width="16" height="16" rx="3" transform="rotate(-9 199 189)" />
    <rect x="146" y="201" width="16" height="16" rx="3" transform="rotate(13 154 209)" />
    <rect x="101" y="186" width="16" height="16" rx="3" transform="rotate(-6 109 194)" />
    <rect x="71"  y="146" width="16" height="16" rx="3" transform="rotate(9 79 154)" />
    <rect x="106" y="116" width="16" height="16" rx="3" transform="rotate(-11 114 124)" />
    <rect x="166" y="126" width="16" height="16" rx="3" transform="rotate(15 174 134)" />
    <rect x="126" y="161" width="16" height="16" rx="3" transform="rotate(-4 134 169)" />
    <rect x="196" y="101" width="16" height="16" rx="3" transform="rotate(8 204 109)" />
    <rect x="81"  y="111" width="16" height="16" rx="3" transform="rotate(-13 89 119)" />
    <rect x="156" y="76"  width="16" height="16" rx="3" transform="rotate(5 164 84)" />
  </g>

  <!-- Trajectoire qui s'essouffle avant d'arriver -->
  <line x1="262" y1="150" x2="322" y2="150" stroke="#57534a" stroke-width="2"
        stroke-dasharray="5 6" opacity="0.5" />

  <!-- Le bon prospect : jamais touché -->
  <circle cx="360" cy="150" r="26" fill="none" stroke="#171613" stroke-width="2.5" />
  <circle cx="360" cy="150" r="17" fill="#d3ccbc" opacity="0.6" />
  <circle cx="360" cy="150" r="7"  fill="url(#accent)" />

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d8bff" />
      <stop offset="1" stop-color="#b06bff" />
    </linearGradient>
  </defs>

  <!-- Légendes -->
  <text x="150" y="286" text-anchor="middle" font-family="Archivo, sans-serif"
        font-weight="600" font-size="15" letter-spacing="1.4" fill="#57534a">TOUTE LA LISTE</text>
  <text x="360" y="286" text-anchor="middle" font-family="Archivo, sans-serif"
        font-weight="700" font-size="15" letter-spacing="1.2" fill="#171613">LE BON PROSPECT</text>
</svg>
