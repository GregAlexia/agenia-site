name: Changer le mot de passe de la documentation

# Rotation en self-service : onglet Actions → ce workflow → « Run workflow »,
# saisir l'ancien et le nouveau mot de passe. Le contenu est re-chiffré,
# commité, et le site redéployé — le tout automatiquement.
#
# Sécurité :
# - Seul un détenteur de l'ANCIEN mot de passe peut effectuer la rotation
#   (sinon le déchiffrement échoue et rien n'est modifié).
# - Les mots de passe ne sont ni stockés ni affichés dans les journaux
#   (add-mask + passage par variables d'environnement).
# - Seuls les collaborateurs du dépôt peuvent lancer ce workflow.

on:
  workflow_dispatch:
    inputs:
      ancien_mot_de_passe:
        description: "Mot de passe ACTUEL de la documentation"
        required: true
        type: string
      nouveau_mot_de_passe:
        description: "NOUVEAU mot de passe (12 caractères minimum — conseil : 4 mots séparés par des tirets)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Masquer les mots de passe dans les journaux
        env:
          ANCIEN_MDP: ${{ inputs.ancien_mot_de_passe }}
          NOUVEAU_MDP: ${{ inputs.nouveau_mot_de_passe }}
        run: |
          echo "::add-mask::$ANCIEN_MDP"
          echo "::add-mask::$NOUVEAU_MDP"

      - name: Re-chiffrer la documentation
        env:
          ANCIEN_MDP: ${{ inputs.ancien_mot_de_passe }}
          NOUVEAU_MDP: ${{ inputs.nouveau_mot_de_passe }}
        run: node outils/rotation-mdp.cjs

      - name: Committer la page re-chiffrée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/index.html
          git commit -m "Rotation du mot de passe de la documentation"
          git push

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
