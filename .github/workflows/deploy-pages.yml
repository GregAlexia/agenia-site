name: Déploiement GitHub Pages

# Publie le site (racine du dépôt) sur GitHub Pages à chaque push sur main,
# et peut être lancé manuellement depuis l'onglet Actions (« Run workflow »).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
